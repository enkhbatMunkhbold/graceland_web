databases:
  - name: graceland-preview-db
    plan: free
    databaseName: graceland_preview
    user: graceland_preview

services:
  - type: web
    name: graceland-web-pwa
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && npm ci --prefix client && npm run build --prefix client
    startCommand: cd server && flask --app app db upgrade && gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: graceland-preview-db
          property: connectionString
